  <path d="M50,60 Q100,20 200,35 Q300,10 420,50 Q470,100 450,180 Q390,260 300,270 Q200,280 100,230 Q30,170 50,60 Z" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="rgba(255,255,255,0.06)"/>
  <!-- Grid Lines -->
  <line x1="50" y1="100" x2="450" y2="100" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4 4"/>
  <line x1="50" y1="180" x2="450" y2="180" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4 4"/>
  <line x1="150" y1="50" x2="150" y2="250" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4 4"/>
  <line x1="300" y1="50" x2="300" y2="250" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4 4"/>
  <!-- Regional Hotspots -->
  <circle cx="120" cy="95" r="7" fill="#F08028"/>
  <circle cx="120" cy="95" r="14" fill="rgba(240,128,40,0.3)"/>
  
  <circle cx="230" cy="130" r="7" fill="#F08028"/>
  <circle cx="230" cy="130" r="14" fill="rgba(240,128,40,0.3)"/>
  
  <circle cx="360" cy="110" r="7" fill="#F08028"/>
  <circle cx="360" cy="110" r="14" fill="rgba(240,128,40,0.3)"/>
  
  <circle cx="310" cy="200" r="7" fill="#F08028"/>
  <circle cx="310" cy="200" r="14" fill="rgba(240,128,40,0.3)"/>
  
  <circle cx="160" cy="200" r="7" fill="#F08028"/>
  <circle cx="160" cy="200" r="14" fill="rgba(240,128,40,0.3)"/>
  <!-- Connections -->
  <path d="M120 95 L230 130 L360 110 M230 130 L310 200 M230 130 L160 200" stroke="#F08028" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <text x="250" y="275" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.8" text-anchor="middle">50 STATES ESTIMATING COVERAGE NETWORK</text>
