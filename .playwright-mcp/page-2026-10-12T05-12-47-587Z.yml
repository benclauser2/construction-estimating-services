            - paragraph [ref=f1e558]:
              - text: The processing facility construction estimating costs are projected expenses for structural work, mechanical systems, electrical installations, processing equipment, labor, materials, and supporting construction requirements. Estimators review facility drawings, specifications, equipment schedules, process layouts, and utility requirements. Structural costs cover foundations, framing, floors, platforms, supports, walls, and related assemblies. Mechanical and electrical costs cover piping, ventilation, utilities, power distribution, controls, and equipment connections. Equipment requirements affect installation work, utility connections, foundations, access provisions, and specialized labor. Material and labor costs depend on specifications, quantities, availability, regional rates, and project requirements. Detailed analysis supports
