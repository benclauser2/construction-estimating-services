        - generic [ref=f1e717]:
          - paragraph [ref=f1e718]: Example work
          - heading "Industrial Construction Estimating Projects" [level=2] [ref=f1e719]
          - paragraph [ref=f1e720]: Industrial construction estimating projects demonstrate experience across facility development, manufacturing operations, warehouse construction, and processing environments. Representative estimates address project drawings, specifications, material quantities, labor requirements, equipment needs, subcontractor scopes, and applicable construction costs. Each project type requires review of facility requirements and measurable work across relevant trades. Structured estimates organize projected costs for budgeting, bidding, procurement, and project planning. The following examples illustrate representative industrial estimating scopes.
          - button "Read More →" [ref=f1e721] [cursor=pointer]
        - generic [ref=f1e722]:
          - article [ref=f1e723]:
            - generic [ref=f1e727]: "01"
            - heading "Industrial Facility Construction Estimate" [level=3] [ref=f1e728]
            - paragraph [ref=f1e729]: An industrial facility construction estimate covers the projected costs of developing a new industrial building and associated site work. The estimating scope includes foundations, structural steel, concrete, masonry, roofing, electrical systems, plumbing, HVAC, mechanical work, and site development. Estimators measure quantities from architectural, structural, mechanical, electrical, and civil documents. Labor, material, equipment, and subcontractor costs receive pricing based on project requirements. The completed estimate provides organized cost information for budgeting, bidding, procurement, and construction planning.
            - button "Read More →" [ref=f1e730] [cursor=pointer]
          - article [ref=f1e731]:
            - generic [ref=f1e735]: "02"
            - heading "Manufacturing Facility Construction Estimate" [level=3] [ref=f1e736]
            - paragraph [ref=f1e737]: A manufacturing facility construction estimate addresses production buildings, equipment areas, structural components, building systems, and supporting infrastructure. Estimators review production layouts, equipment requirements, foundations, structural framing, mechanical systems, electrical installations, plumbing, HVAC, and site work. Material quantities are measured from project drawings and specifications. Labor requirements reflect applicable construction trades and specialized installation work. Equipment and subcontractor costs address documented project requirements. The estimate organizes manufacturing facility costs into trade-specific categories for budgeting, bidding, procurement, and project planning.
            - button "Read More →" [ref=f1e738] [cursor=pointer]
          - article [ref=f1e739]:
            - generic [ref=f1e743]: "03"
            - heading "Warehouse or Processing Facility Estimate" [level=3] [ref=f1e744]
            - paragraph [ref=f1e745]: A warehouse or processing facility estimate covers storage areas, loading facilities, production spaces, structural systems, mechanical systems, electrical work, equipment requirements, labor, materials, and site improvements. Estimators review architectural plans, structural drawings, equipment schedules, specifications, and utility requirements. Quantity takeoffs measure concrete, structural steel, roofing, flooring, piping, electrical materials, and related construction components. Labor, equipment, and subcontractor costs are priced according to the documented scope and project requirements. The completed estimate provides organized cost information for budgeting, bidding, procurement, and construction planning.
            - button "Read More →" [ref=f1e746] [cursor=pointer]
