            - generic [ref=f18e757]:
              - paragraph [ref=f18e758]: A residential construction estimate typically takes several business days to complete, depending on project size and complexity. Small projects require less plan review and quantity measurement than larger homes or multifamily developments. Detailed projects require additional time for trade takeoffs, pricing, scope review, and quality checks. Complete drawings and specifications help streamline the estimating process and reduce delays caused by missing project information. Complex designs require additional review when plans contain custom details, multiple structures, or specialized systems. Large residential projects require more time to organize quantities across multiple trades and construction phases.
              - paragraph [ref=f18e759]: Revisions to drawings or specifications add further estimating time because quantities and pricing need to be reviewed again. A clear project scope helps establish a practical turnaround time before estimating work begins. Rush requests often require priority scheduling and faster document review. Estimate delivery depends on the number of trades covered and the level of cost detail requested. Projects with complete drawings generally move through quantity takeoffs and pricing more efficiently. Final quality checks require additional time to verify quantities, calculations, and scope coverage before delivery.
