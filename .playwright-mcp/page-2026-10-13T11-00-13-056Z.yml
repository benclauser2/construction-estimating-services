    - generic [ref=f18e174]:
      - generic [ref=f18e175]:
        - heading "Residential Construction Estimating Costs" [level=1] [ref=f18e176]
        - paragraph [ref=f18e177]: Residential construction estimating costs show the projected price of a home project before construction begins. The guide explains how estimates are prepared, which cost categories make up a bid, and how estimators turn project plans into cost figures. The process covers new construction, additions, and remodeling projects while identifying the professionals who rely on accurate cost information.
        - paragraph [ref=f18e178]: A residential estimate separates expenses into categories to provide a clearer view of expected project spending. Site preparation, foundations, framing, roofing, electrical work, plumbing, interior finishes, labor, and permits contribute to the estimated total. Material prices, location, labor rates, project requirements, design complexity, and site conditions affect the final construction cost.
        - navigation "On this page" [ref=f18e179]:
