  - generic [ref=e134]:
    - generic [ref=e135]:
      - heading "Our Construction Estimating Services" [level=2] [ref=e136]
      - paragraph [ref=e137]: Construction estimating services cover project costing, quantity measurement, bidding support, and trade-specific pricing. Each service addresses a different stage of construction planning and supports accurate financial preparation.
    - generic [ref=e138]:
      - generic [ref=e139]:
        - heading "1. Construction Cost Estimating Services" [level=3] [ref=e147]
        - paragraph [ref=e148]:
          - text: Construction cost estimating services calculate the expected financial requirements for a complete construction project. Estimates account for labor, materials, equipment, subcontractor work, site expenses, overhead, and applicable project costs.
          - button "Read More →" [ref=e149] [cursor=pointer]
      - generic [ref=e150]:
        - heading "2. Quantity Takeoff Services" [level=3] [ref=e155]
        - paragraph [ref=e156]:
          - text: Quantity takeoff services measure construction components from drawings and project documents. The process converts plans into measurable quantities for concrete, steel, lumber, finishes, fixtures, earthwork, and other construction materials.
          - button "Read More →" [ref=e157] [cursor=pointer]
      - generic [ref=e158]:
        - heading "3. Material Takeoff Services" [level=3] [ref=e163]
        - paragraph [ref=e164]:
          - text: Material takeoff services identify and quantify materials required for construction. Takeoffs organize quantities for purchasing, budgeting, bidding, and project planning.
          - button "Read More →" [ref=e165] [cursor=pointer]
      - generic [ref=e166]:
        - heading "4. Bid Estimating Services" [level=3] [ref=e171]
        - paragraph [ref=e172]:
          - text: Bid estimating services prepare project costs for contractors and subcontractors competing for construction work. Estimators review plans, measure quantities, apply labor and material rates, and organize costs into a bid-ready format.
          - button "Read More →" [ref=e173] [cursor=pointer]
      - generic [ref=e174]:
        - heading "5. Residential Construction Estimating" [level=3] [ref=e178]
        - paragraph [ref=e179]:
          - text: Residential construction estimating covers homes, additions, renovations, extensions, and other housing projects. Estimates account for material quantities, labor requirements, equipment, subcontractor scopes, and project-specific expenses.
          - button "Read More →" [ref=e180] [cursor=pointer]
      - generic [ref=e181]:
        - heading "6. Commercial Construction Estimating" [level=3] [ref=e185]
        - paragraph [ref=e186]:
          - text: Commercial construction estimating covers offices, retail buildings, restaurants, schools, medical facilities, and other commercial developments. Estimates organize costs across architectural, structural, mechanical, electrical, plumbing, interior, and site-related scopes.
          - button "Read More →" [ref=e187] [cursor=pointer]
      - generic [ref=e188]:
        - heading "7. Industrial Construction Estimating" [level=3] [ref=e192]
        - paragraph [ref=e193]:
          - text: Industrial construction estimating covers warehouses, manufacturing facilities, processing buildings, distribution centers, and related developments. Estimates account for structural systems, equipment, utilities, mechanical systems, electrical installations, sitework, and specialized construction requirements.
          - button "Read More →" [ref=e194] [cursor=pointer]
      - generic [ref=e195]:
        - heading "8. MEP Estimating Services" [level=3] [ref=e200]
        - paragraph [ref=e201]:
          - text: MEP estimating services cover mechanical, electrical, and plumbing construction costs. Estimators quantify equipment, fixtures, piping, ductwork, wiring, controls, fittings, and associated installation requirements.
          - button "Read More →" [ref=e202] [cursor=pointer]
  - generic [ref=e204]:
    - generic [ref=e205]:
      - heading "Why Choose Our Construction Estimating Services?" [level=2] [ref=e206]
      - paragraph [ref=e207]: Construction estimating services provide greater value when accuracy, experience, regional pricing, and organized deliverables work together. A structured estimating process gives contractors and project owners clearer cost information before financial commitments are made.
